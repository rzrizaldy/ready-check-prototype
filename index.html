<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ready-Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* City of Pittsburgh web tokens: Outfit, navy #233b77, gold #f8bd32, pale blue #eaf1fc */
:root{
  --navy:#233b77; --navy-dk:#1a2c5a; --gold:#f8bd32; --gold-ink:#7a5300; --gold-bg:#fff7e2;
  --sky:#eaf1fc; --bg:#f6f6f4; --white:#fff; --ink:#1f1f1f; --muted:#5a5a5a; --line:#dedede;
  --green:#1e7b45; --green-bg:#e9f5ee; --red:#b42318; --red-bg:#fdeceb;
  --sans:'Outfit', Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:disabled{cursor:not-allowed}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;font-weight:600;font-size:15px;border:1px solid var(--navy);background:var(--white);color:var(--navy);border-radius:4px;transition:background .15s}
.btn:hover:not(:disabled){background:var(--sky)}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--navy-dk)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.gold:hover:not(:disabled){background:#efb21e}
.btn.lg{padding:14px 24px;font-size:17px}
.btn.sm{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.35}
.link{color:var(--navy);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* top bar */
header{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar-in{max-width:1240px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand b{font-size:18px;font-weight:700}
.brand span{font-size:13px;color:var(--muted)}
nav.ch{display:flex;gap:4px;margin-left:auto}
nav.ch button{padding:8px 12px;font-size:15px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
nav.ch button .n{color:#9a9a9a;margin-right:6px;font-size:13px}
nav.ch button.done{color:var(--ink)}
nav.ch button[aria-current="true"]{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
#autoBtn{white-space:nowrap}
.progress{height:3px;background:transparent}
.progress i{display:block;height:3px;width:0;background:var(--gold);transition:width .3s linear}

/* stage */
main{max-width:1240px;margin:0 auto;padding:40px 28px 64px}
.stage{display:grid;grid-template-columns:360px minmax(0,1fr);gap:56px;align-items:start}
.story .num{font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.story h1{font-size:38px;line-height:1.1;font-weight:700;margin:10px 0 14px;letter-spacing:-.01em}
.story .sub{font-size:18px;color:var(--muted)}
.roles{margin:28px 0 0}
.roles div{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line);font-size:16px}
.roles div:last-child{border-bottom:1px solid var(--line)}
.roles dt{font-weight:600;font-size:14px;padding-top:1px}
.roles .a dt{color:var(--gold-ink)} .roles .p dt{color:var(--navy)}
.try{margin-top:22px;font-size:15px;color:var(--muted)}
.try b{color:var(--ink)}
.nextrow{display:flex;align-items:center;gap:18px;margin-top:26px}

/* product frame */
.frame{background:var(--white);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.frame-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:#fbfbfa}
.frame-h b{font-size:15px}
.frame-h span{font-size:14px;color:var(--muted)}
.frame-b{padding:24px}
.frame-f{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 24px;border-top:1px solid var(--line);background:#fbfbfa}
.frame-f .msg{font-size:15px;color:var(--muted)}
.kicker{font-size:14px;color:var(--muted)}
.h2{font-size:22px;font-weight:600;line-height:1.25}

/* status mark: small square + word */
.mk{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;white-space:nowrap}
.mk::before{content:"";width:9px;height:9px;background:currentColor}
.mk.ok{color:var(--green)} .mk.fix{color:var(--red)} .mk.chk{color:var(--gold-ink)} .mk.wait{color:#9a9a9a} .mk.now{color:var(--navy)}

/* checklist */
.list{margin-top:18px}
.item{display:grid;grid-template-columns:1fr auto;gap:16px;padding:14px 0;border-top:1px solid var(--line);align-items:start;transition:opacity .25s}
.item:last-child{border-bottom:1px solid var(--line)}
.item.pending{opacity:.35}
.item .t{font-weight:500}
.item .s{font-size:14px;color:var(--muted);margin-top:2px}
.item.bad{background:var(--red-bg);margin:0 -24px;padding:14px 24px}
.banner{margin-top:18px;padding:14px 16px;border-radius:4px;font-weight:600}
.banner.ok{background:var(--green-bg);color:var(--green)}
.banner.chk{background:var(--gold-bg);color:var(--gold-ink)}

/* blueprint */
.plan{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:start}
.plan svg{width:100%;height:auto;display:block;border-radius:4px}
.flagcard{border:1px solid #f0d58f;background:var(--gold-bg);border-radius:4px;padding:14px 16px}
.flagcard .t{font-weight:600;margin:6px 0 4px}
.flagcard .s{font-size:14px;color:var(--muted)}
.passed{font-size:15px;color:var(--muted);margin-top:14px}
.passed b{color:var(--green)}

/* inspector camera */
.cam{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;align-items:start}
.vf{position:relative;aspect-ratio:4/3;background:#cfdbe8;border-radius:4px;overflow:hidden;touch-action:none;cursor:grab;user-select:none}
.vf:active{cursor:grabbing}
.vf canvas{width:100%;height:100%;display:block}
.vf .ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vf .tl{position:absolute;left:14px;top:12px;font-size:13px;font-weight:600;color:#fff;background:rgba(20,30,50,.55);padding:3px 8px;border-radius:3px}
.vf .hud{position:absolute;left:0;right:0;bottom:14px;text-align:center;pointer-events:none}
.vf .hud span{display:inline-block;background:rgba(20,24,30,.82);color:#fff;font-size:15px;font-weight:500;padding:7px 14px;border-radius:4px}
.vf .hud span.good{background:#1e7b45}
.vf .tl:empty{display:none}
.vf .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.vf .flash.on{opacity:.9;transition:none}
.vf .fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#eef2f7;text-align:center;padding:20px}
.ctrl{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
.ctrl .help{font-size:13px;color:var(--muted);margin-left:auto}
.shots{display:flex;flex-direction:column}
.shot{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.shot:last-child{border-bottom:1px solid var(--line)}
.shot .i{font-size:13px;color:var(--muted);padding-top:2px}
.shot .t{font-size:15px;font-weight:500}
.shot.cur{background:var(--sky);margin:0 -10px;padding:11px 10px;grid-template-columns:22px 1fr}
.shot .mk{margin-top:2px;font-size:13px}

/* office review */
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rev{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start;margin-top:18px}
.rev .decide:first-child{margin-top:0}
.thumb{display:block;text-align:left;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;width:100%}
.thumb .im{position:relative;aspect-ratio:4/3;background:#e9edf2}
.thumb .im img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .cap{display:flex;justify-content:space-between;gap:6px;padding:6px 8px;font-size:13px}
.thumb.sel{outline:2px solid var(--navy);outline-offset:-1px}
.thumb.flagged{border-color:#e9b949}
.photo{position:relative;aspect-ratio:4/3;background:#e9edf2;border-radius:4px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.decide{margin-top:14px}
.decide .q{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn.on{background:var(--navy);color:#fff}
.btn.on:disabled{opacity:1}

/* intro and outcome */
.intro{max-width:980px}
.intro .eyebrow{font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.intro h1{font-size:56px;line-height:1.04;font-weight:700;letter-spacing:-.02em;margin:14px 0 18px;max-width:820px}
.intro .sub{font-size:21px;color:var(--muted);max-width:680px}
.intro .sub b{color:var(--ink);font-weight:600}
.cta{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:32px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:56px;border-top:1px solid var(--line)}
.facts div{padding:18px 24px 0 0}
.facts div+div{padding-left:24px;border-left:1px solid var(--line)}
.facts b{display:block;font-size:30px;font-weight:700;color:var(--navy);line-height:1.15}
.facts span{display:block;font-size:15px;color:var(--muted);margin-top:4px}
.src{font-size:12px;color:var(--muted);margin-top:18px}
.compare{margin-top:34px;border-top:1px solid var(--line)}
.compare .row{display:grid;grid-template-columns:150px 1fr 1fr;gap:24px;padding:18px 0;border-bottom:1px solid var(--line);align-items:baseline}
.compare .row.h{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 0}
.compare .who{font-weight:600}
.compare .before{color:var(--muted)}
.compare .after{font-weight:500}
.never{margin-top:28px;font-size:20px;font-weight:600}
.never span{color:var(--muted);font-weight:400}

footer{max-width:1240px;margin:0 auto;padding:0 28px 32px;font-size:13px;color:var(--muted)}

/* autoplay ring */
.ring{outline:4px solid var(--gold) !important;outline-offset:3px}

@media (max-width:980px){
  .stage{grid-template-columns:1fr;gap:28px}
  .story h1{font-size:30px}
  .plan,.cam,.rev{grid-template-columns:1fr}
  .thumbs{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:720px){
  .bar-in{flex-wrap:wrap;gap:10px;padding:10px 16px}
  nav.ch{order:3;width:100%;margin-left:0;overflow-x:auto}
  nav.ch button{padding:6px 8px;font-size:14px}
  #autoBtn{margin-left:auto}
  main{padding:24px 16px 48px}
  footer{padding:0 16px 24px}
  .intro h1{font-size:36px}
  .intro .sub{font-size:18px}
  .facts{grid-template-columns:1fr}
  .facts div,.facts div+div{padding:14px 0;border-left:none;border-bottom:1px solid var(--line)}
  .compare .row{grid-template-columns:1fr;gap:4px}
  .compare .row.h{display:none}
  .frame-b{padding:18px}
  .item.bad{margin:0 -18px;padding:14px 18px}
  .ctrl .help{display:none}
}
</style>
</head>
<body>
<header>
  <div class="bar-in">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="2" y="9" width="5" height="15" fill="#f8bd32"/><rect x="9" y="3" width="5" height="21" fill="#233b77"/><rect x="16" y="12" width="5" height="12" fill="#233b77"/></svg>
      <b>Ready-Check</b><span>City of Pittsburgh · prototype</span>
    </div>
    <nav class="ch" id="nav" aria-label="Chapters"></nav>
    <button class="btn gold sm" id="autoBtn">▶ Auto-play</button>
  </div>
  <div class="progress"><i id="prog"></i></div>
</header>
<main id="main"></main>
<footer>Class prototype, CMU Design of AI Products. Names, addresses, scores and code limits are simulated. Not a City of Pittsburgh service.</footer>
<script>
(() => {
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const wait = ms => new Promise(r => setTimeout(r, ms));
const THR = 0.80;
const WORD = ['No','One','Two','Three','Four','Five','Six','Seven','Eight'];

/* ---------------- story ---------------- */
const CH = [
  {nav:'Start'},
  {nav:'Apply', num:'01 · Applicant', h:"Fix it before it's filed.",
   sub:"Laurel is replacing her windows. Ready-Check checks her application against the City's list before she submits.",
   agent:'Checks 5 items and names the rule behind any problem.', person:'Laurel fixes the problem and submits.'},
  {nav:'Review', num:'02 · City office', h:"Staff review only what's unsure.",
   sub:"A vision model reads the drawings. Anything it isn't sure about goes to a person.",
   agent:'Reads the drawings. Passes 4 checks, flags 1.', person:'Plan reviewer checks the flag and issues the permit.'},
  {nav:'Inspect', num:'03 · Inspector', h:'Every photo usable on the first visit.',
   sub:'On site, the model scores each photo live and says how to fix a bad shot.',
   agent:'Scores each photo and asks for a retake.', person:'Inspector takes the photos. Nothing is passed or failed on site.'},
  {nav:'Decide', num:'04 · City office', h:'', sub:'The office sees flagged photos first, with the reason for each flag.',
   agent:"Flags only what it isn't sure about.", person:'Reviewer decides each flag and signs off.'},
  {nav:'Summary'},
];

const CHECKS = [
  ['Standard permit with drawings', 'W-3 gets bigger, so drawings are required.'],
  ['Not historic, floodplain, or condemned', 'City map layers.'],
  ['Contractor license active', 'City license records.'],
  ['Drawings readable', 'Sheets A-1 and A-2.'],
  ['Insurance name matches tax record', 'Certificate says "Windows LLC". Tax record says "Window Co LLC".', 'New certificate matches.'],
];

const SHOTS = [
  {name:'Whole window', aim:'frame', need:[['frame',0.34]]},
  {name:'Sill and sealant', aim:'sill', need:[['sill',0.5],['sealant',0.45]]},
  {name:'Energy label', aim:'label', need:[['label',0.2]]},
  {name:'Opening with tape', aim:'tape', need:[['opening',0.45],['tape',0.45]]},
];
const OBJNAME = {frame:'window', sill:'sill', sealant:'sealant', label:'label', opening:'opening', tape:'tape'};

function fresh(){ return {ch:0, pc:'idle', shown:0, w3:false, issued:false, shot:0, photos:[null,null,null,null], sent:false, verdicts:{}, sel:null, final:null}; }
let S = fresh();

const done = i => i === 0 ? true : i === 1 ? S.pc === 'submitted' : i === 2 ? S.issued : i === 3 ? S.sent : i === 4 ? !!S.final : true;
const allFlags = () => S.photos.flatMap(p => p ? p.flags : []);

/* jumping ahead fills in the earlier chapters so every screen makes sense */
function complete(i){
  if (i === 1){ S.pc = 'submitted'; S.shown = 5; }
  if (i === 2){ S.w3 = true; S.issued = true; }
  if (i === 3 && !S.sent){ SHOTS.forEach((s,k) => { if (!S.photos[k]) S.photos[k] = samplePhoto(k); }); S.sent = true; }
  if (i === 4 && !S.final){ allFlags().forEach(f => S.verdicts[f.id] = S.verdicts[f.id] || (f.id === 'gap' ? 'fix' : 'ok')); S.final = Object.values(S.verdicts).includes('fix') ? 'fix' : 'approve'; }
}
function go(i){
  for (let k = 1; k < i; k++) if (!done(k)) complete(k);
  if (S.ch === 3 && i !== 3) Field.detach();
  S.ch = i; S.sel = null;
  render(true);
  window.scrollTo({top:0});
}

/* ---------------- layout ---------------- */
function renderNav(){
  $('#nav').innerHTML = CH.slice(1,5).map((c,k) => { const i = k+1;
    return `<button data-go="${i}" class="${done(i)?'done':''}" aria-current="${S.ch===i}"><span class="n">0${i}</span>${c.nav}</button>`; }).join('');
  $$('#nav [data-go]').forEach(b => b.addEventListener('click', () => go(+b.dataset.go)));
}
function story(i){
  const c = CH[i], nx = CH[i+1];
  const h = i === 4 ? decideHeadline() : c.h;
  return `<div class="story">
    <div class="num">${c.num}</div>
    <h1 id="storyH">${h}</h1>
    <p class="sub">${c.sub}</p>
    <dl class="roles"><div class="a"><dt>Agent</dt><dd>${c.agent}</dd></div><div class="p"><dt>Person</dt><dd>${c.person}</dd></div></dl>
    <div class="nextrow"><button class="btn ${done(i)?'primary':''}" id="next">${i===4?'See what changes':'Next: '+nx.nav} →</button><button class="link" id="prev">Back</button></div>
  </div>`;
}
function decideHeadline(){ const n = allFlags().length; return n ? `${WORD[n]||n} flag${n>1?'s':''}. ${WORD[n]||n} human call${n>1?'s':''}.` : 'No flags. One sign-off.'; }

function render(full){
  renderNav();
  const m = $('#main');
  if (S.ch === 0) return intro(m);
  if (S.ch === 5) return outcome(m);
  if (full || !$('#screen')){
    m.innerHTML = `<div class="stage">${story(S.ch)}<div id="screen"></div></div>`;
    $('#next').addEventListener('click', () => go(S.ch + 1));
    $('#prev').addEventListener('click', () => go(S.ch - 1));
  } else {
    const n = $('#next'); n.className = 'btn ' + (done(S.ch) ? 'primary' : '');
    if (S.ch === 4) $('#storyH').textContent = decideHeadline();
  }
  [null, apply, review, inspect, decide][S.ch]($('#screen'));
}

/* ---------------- 0. hook ---------------- */
function intro(m){
  m.innerHTML = `<section class="intro">
    <div class="eyebrow">Pittsburgh permits · AI agent prototype</div>
    <h1>One missing page can cost a homeowner weeks.</h1>
    <p class="sub">Ready-Check checks permit files and inspection photos the moment they arrive. <b>The agent checks. A person decides.</b></p>
    <div class="cta"><button class="btn primary lg" id="startBtn">Start the 4-step walkthrough</button><button class="btn gold lg" id="autoStart">▶ Auto-play, 1 minute</button></div>
    <div class="facts">
      <div><b>15 to 30</b><span>business days for a standard Pittsburgh permit review</span></div>
      <div><b>Repeat reviews</b><span>from incomplete files, a cause of delay the City names itself</span></div>
      <div><b>About 30%</b><span>of Denver permits pass the first review. Goal: 80%.</span></div>
    </div>
    <p class="src">Sources: City of Pittsburgh permitting reform plan (March 2026) and permit pages. Denver figure from our research scan, source to confirm.</p>
  </section>`;
  $('#startBtn').addEventListener('click', () => go(1));
  $('#autoStart').addEventListener('click', () => Auto.start());
}

/* ---------------- 1. apply ---------------- */
function apply(el){
  const p = S.pc, fixed = p === 'ready' || p === 'submitted';
  const head = {idle:'Is my application ready?', running:'Checking…', issue:'1 thing to fix', fixing:'Checking the new certificate…', ready:'Ready to submit', submitted:'Submitted'}[p];
  const rows = CHECKS.map((c,i) => {
    const vis = i < S.shown, last = i === 4;
    const st = !vis ? '' : last ? (fixed ? '<span class="mk ok">Fixed</span>' : '<span class="mk fix">Fix</span>') : '<span class="mk ok">OK</span>';
    const sub = last && vis ? (fixed ? c[2] : c[1]) : c[1];
    return `<div class="item ${vis?'':'pending'} ${vis && last && !fixed ? 'bad':''}"><div><div class="t">${c[0]}</div><div class="s">${sub}</div></div>${st}</div>`;
  }).join('');
  const act = {idle:['gold','Run Ready-Check'], issue:['primary','Upload corrected certificate'], ready:['gold','Submit to the City']}[p];
  const msg = {idle:'Takes a few seconds.', running:'Checking 5 items…', issue:'Laurel asks her contractor for a corrected certificate.', fixing:'Uploading…', ready:'"Ready" means complete, not approved.', submitted:'Complete on the first try. Sent to the City.'}[p];
  el.innerHTML = `<div class="frame">
    <div class="frame-h"><b>Laurel's application</b><span>Applicant view</span></div>
    <div class="frame-b"><div class="kicker">1234 Example St · Replace 4 windows</div><div class="h2" style="margin-top:4px">${head}</div><div class="list">${rows}</div></div>
    <div class="frame-f"><span class="msg">${msg}</span>${act ? `<button class="btn ${act[0]}" id="act">${act[1]}</button>` : ''}</div></div>`;
  const a = $('#act'); if (a) a.addEventListener('click', applyAct);
}
async function applyAct(){
  if (S.pc === 'idle'){
    S.pc = 'running'; S.shown = 0; render();
    for (let i = 0; i < 5; i++){ await wait(300); S.shown = i+1; if (S.ch === 1) render(); }
    await wait(250); S.pc = 'issue'; render();
  } else if (S.pc === 'issue'){
    S.pc = 'fixing'; render(); await wait(800); S.pc = 'ready'; render();
  } else if (S.pc === 'ready'){
    S.pc = 'submitted'; render();
  }
}

/* ---------------- 2. review ---------------- */
function planSvg(){
  const ok = '#5fd08f', amb = '#f8bd32', W3 = S.w3 ? ok : amb;
  const box = (x,y,w,h,c,label,ly) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="6 4"/><text x="${x}" y="${ly}" fill="${c}" font-size="12" font-weight="600">${label}</text>`;
  return `<svg viewBox="0 0 640 400" role="img" aria-label="Floor plan with the vision model's boxes">
    <defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#2c4c86" stroke-width="1"/></pattern></defs>
    <rect width="640" height="400" fill="#1f3a6e"/><rect width="640" height="400" fill="url(#g)"/>

}
/* what the vision language model reads, and the flags it raises (simulated, same every time) */
function analyse(i, dets){

    const cx0 = Math.max(-1,x0), cx1 = Math.min(1,x1), cy0 = Math.max(-1,y0), cy1 = Math.min(1,y1);
    const vis = (cx1>cx0 && cy1>cy0) ? (cx1-cx0)*(cy1-cy0)/area : 0;
    if (vis <= 0) return {key, conf:0, box:null, hint:'Turn toward it'};
    const sz = Math.max((x1-x0)/2, (y1-y0)/2);
    const sizeF = Math.min(1, Math.max(0, (sz - minSize*.35) / (minSize*.65)));
    const c = b.getCenter(new THREE.Vector3()), toCam = camera.position.clone().sub(c).normalize();
    const angF = Math.min(1, Math.max(0, (toCam.dot(o.n) - .35) / .5));
    let conf = .97 * Math.pow(vis,3) * sizeF * (.55 + .45*angF);
    conf = Math.max(0, Math.min(.99, conf + .006*Math.sin(performance.now()/300 + key.length)));
    const hint = vis < .9 ? (sz > minSize*1.4 ? 'Step back' : 'Turn toward it') : sizeF < 1 ? 'Move closer' : angF < .75 ? 'Face it straight on' : '';
    return {key, conf:+conf.toFixed(2), box:[(cx0+1)/2, (1-cy1)/2, (cx1+1)/2, (1-cy0)/2], hint};
  }
  function liveCheck(){
    if (S.sent){ const o = $('#ov'), h = $('#hud'); if (o) o.innerHTML = ''; if (h){ h.className = 'good'; h.textContent = 'Photos sent to the office'; } return; }
    liveDets = SHOTS[S.shot].need.map(([k,m]) => detect(k,m));
    const ov = $('#ov'); if (!ov) return;
    ov.innerHTML = liveDets.filter(d => d.box && d.conf > .05).map(d => {
      const [a,b,c,e] = d.box, col = d.conf >= THR ? '#3fb673' : '#f8bd32', ly = b*750 > 34 ? b*750-6 : e*750+24, label = `${OBJNAME[d.key]} ${d.conf.toFixed(2)}`;
      return `<rect x="${a*1000}" y="${b*750}" width="${(c-a)*1000}" height="${(e-b)*750}" fill="none" stroke="${col}" stroke-width="4"/><rect x="${Math.min(a*1000, 1000-label.length*11-12)}" y="${ly-21}" width="${label.length*11+12}" height="27" fill="${col}"/><text x="${Math.min(a*1000, 1000-label.length*11-12)+6}" y="${ly-1}" font-family="Outfit, Arial, sans-serif" font-weight="600" font-size="18" fill="#111">${label}</text>`;
    }).join('');
    const worst = liveDets.slice().sort((a,b) => a.conf-b.conf)[0], good = liveDets.every(d => d.conf >= THR);
    const hud = $('#hud'); hud.className = good ? 'good' : '';
    hud.textContent = good ? 'Looks good. Take the photo.' : `${worst.hint || 'Hold steady'}: ${OBJNAME[worst.key]}`;
    $('#vfTl').textContent = `Shot ${S.shot+1} of 4 · ${SHOTS[S.shot].name}`;
  }
  function loop(t){
    raf = requestAnimationFrame(loop);
    if (!wrap || !wrap.isConnected) return detach();
    if (S.ch !== 3) return;
    if (wrap.clientWidth !== lastW) size();
    if (!lastW) return;
    place(); renderer.render(scene, camera);
    if (t - lastLive > 140){ lastLive = t; liveCheck(); }
  }
  let drag = null;
  const onDown = e => { drag = {x:e.clientX, y:e.clientY, yaw:yawT, pitch:pitchT}; try { wrap.setPointerCapture(e.pointerId); } catch(_){} };
  const onMove = e => { if (!drag) return; const k = 3 / wrap.clientWidth; yawT = Math.max(-1.15, Math.min(1.15, drag.yaw - (e.clientX-drag.x)*k)); pitchT = Math.max(-.25, Math.min(.8, drag.pitch + (e.clientY-drag.y)*k)); };
  const onUp = () => { drag = null; };
  const onWheel = e => { e.preventDefault(); dolly(e.deltaY > 0 ? 1.12 : .89); };
  function dolly(f){ dT = Math.max(.25, Math.min(10, dT*f)); }
  function aimAt(k){ const a = AIMS[k]; tgt.x = a.p[0]; tgt.y = a.p[1]; tgt.z = a.p[2]; dT = a.d; yawT = a.yaw; pitchT = a.pitch; }
  function attach(w, c){
    detach();
    wrap = w; canvas = c;
    try {
      if (typeof THREE === 'undefined') throw new Error('three.js did not load');
      renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      camera = new THREE.PerspectiveCamera(55, 4/3, .05, 100);
      if (!scene) build();
    } catch (e){ console.warn(e); renderer = null; $('#fallback').hidden = false; $('#hud').textContent = '3D view unavailable'; return; }
    aimAt(SHOTS[S.shot].aim); cur.x = tgt.x; cur.y = tgt.y; cur.z = tgt.z; dist = dT; yaw = yawT; pitch = pitchT;
    size();
    wrap.addEventListener('pointerdown', onDown); wrap.addEventListener('pointermove', onMove);
    wrap.addEventListener('pointerup', onUp); wrap.addEventListener('pointercancel', onUp);
    wrap.addEventListener('wheel', onWheel, {passive:false});
    window.addEventListener('resize', size);
    raf = requestAnimationFrame(loop);
  }
  function detach(){
    if (raf) cancelAnimationFrame(raf); raf = null;
    window.removeEventListener('resize', size);
    if (renderer){ renderer.dispose(); renderer = null; }
    wrap = null; lastW = 0;
  }
  function snap(){
    if (!renderer || S.sent) return;
    place(); renderer.render(scene, camera); liveCheck();
    const img = canvas.toDataURL('image/jpeg', .82);
    const dets = liveDets.map(d => Object.assign({}, d)), a = analyse(S.shot, dets);
    S.photos[S.shot] = {img, dets, pass:dets.every(d => d.conf >= THR), reads:a.reads, flags:a.flags, };
    const f = $('#flash'); f.classList.add('on'); setTimeout(() => f.classList.remove('on'), 60);
    const next = S.photos.findIndex(p => !p);
    if (S.photos[S.shot].pass && next >= 0){ S.shot = next; aimAt(SHOTS[next].aim); }
    renderShotList();
  }
  return {attach, detach, snap, dolly, aimAt};
})();

/* ---------------- auto-play: clicks the real buttons, with a gold ring first ---------------- */
const Auto = (() => {
  const TOTAL = 62;
  let run = 0, on = false, t0 = 0, timer = null;
  class Stopped extends Error {}
  const live = id => { if (id !== run) throw new Stopped(); };
  async function pause(id, ms){ const end = performance.now() + ms; while (performance.now() < end){ live(id); await wait(Math.min(100, Math.max(0, end - performance.now()))); } live(id); }
  async function until(id, fn, ms = 6000){ const end = performance.now() + ms; while (!fn()){ if (performance.now() > end) return false; await pause(id, 120); } return true; }
  async function ring(id, el, ms){ if (typeof el === 'string') el = $(el); if (!el) return null; el.scrollIntoView({block:'center', behavior:'smooth'}); el.classList.add('ring'); try { await pause(id, ms); } finally { el.classList.remove('ring'); } return el; }
  async function hit(id, sel, ms = 600){ const el = await ring(id, sel, ms); if (el && !el.disabled) el.click(); return el; }

  async function script(id){
    hardReset(); go(0);
    await pause(id, 3500);
    await hit(id, '#startBtn', 700);
    // 1 apply
    await pause(id, 3600);
    await hit(id, '#act'); await until(id, () => S.pc === 'issue');
    await ring(id, '.item.bad', 1800);
    await hit(id, '#act'); await until(id, () => S.pc === 'ready');
    await pause(id, 500); await hit(id, '#act'); await pause(id, 1300);
    await hit(id, '#next', 500);
    // 2 review
    await pause(id, 3400);
    await ring(id, '.plan svg', 1800); await ring(id, '.flagcard', 1800);
    await hit(id, '#act'); await pause(id, 1000); await hit(id, '#act'); await pause(id, 1300);
    await hit(id, '#next', 500);
    // 3 inspect
    await pause(id, 3400);
    for (let s = 0; s < 4; s++){
      for (let i = 0; i < 12; i++){
        const h = $('#hud') ? $('#hud').textContent : '';
        if (/Looks good/.test(h)) break;
        await hit(id, /Step back/.test(h) ? '#back' : '#closer', 250); await pause(id, 550);
      }
      await pause(id, 300); await hit(id, '#snap', 300); await pause(id, 800);
    }
    await hit(id, '#act'); await pause(id, 1300);
    await hit(id, '#next', 500);
    // 4 decide
    await pause(id, 3200);
    for (let i = 0; i < 8; i++){
      const box = $$('.decide').find(b => !b.querySelector('[data-v].on'));
      if (!box) break;
      const fix = box.dataset.flag === 'gap';
      await ring(id, box, 1600);
      await hit(id, box.querySelector(`[data-v="${fix ? 'fix' : 'ok'}"]`), 400); await pause(id, 600);
    }
    const anyFix = Object.values(S.verdicts).includes('fix');
    await hit(id, `[data-final="${anyFix ? 'fix' : 'approve'}"]`, 800); await pause(id, 1600);
    await hit(id, '#next', 500);
    await pause(id, 1500);
    finish();
  }
  function tick(){ $('#prog').style.width = Math.min(100, (performance.now() - t0) / 1000 / TOTAL * 100) + '%'; }
  function cleanup(){ on = false; clearInterval(timer); timer = null; $$('.ring').forEach(e => e.classList.remove('ring')); $('#autoBtn').textContent = '▶ Auto-play'; }
  function finish(){ run++; cleanup(); $('#prog').style.width = '100%'; setTimeout(() => { if (!on) $('#prog').style.width = '0'; }, 1500); }
  function stop(){ if (!on) return; run++; cleanup(); $('#prog').style.width = '0'; }
  function start(){
    run++; const id = run; on = true; t0 = performance.now();
    $('#autoBtn').textContent = '■ Stop';
    tick(); timer = setInterval(tick, 250);
    script(id).catch(e => { if (!(e instanceof Stopped)){ console.error(e); stop(); } });
  }
  $('#autoBtn').addEventListener('click', () => on ? stop() : start());
  /* a real click anywhere hands control back to the viewer */
  document.addEventListener('pointerdown', e => { if (on && e.isTrusted && !e.target.closest('#autoBtn')) stop(); }, true);
  return {start, stop};
})();

go(0);
})();
</script>
